<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝福</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            width:100vw;
            height:100vh;
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .text{
            font-size:12vw;
            font-weight:bold;
            animation: colorFlash 0.4s infinite;
        }
        @keyframes colorFlash {
            0%{color:#ff3333;}
            25%{color:#33ff33;}
            50%{color:#3388ff;}
            75%{color:#ffff33;}
            100%{color:#ff33ff;}
        }
    </style>
</head>
<body>
    <div class="text">祝你幸福！</div>
</body>
</html>
